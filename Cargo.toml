[workspace]
resolver = "2"
members = ["crates/core", "crates/diagnostics", "crates/proxy", "crates/transparent", "crates/nfqueue", "crates/dns"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"

[workspace.dependencies]
trdpi-core = { path = "crates/core" }
trdpi-proxy = { path = "crates/proxy" }
trdpi-dns = { path = "crates/dns" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
