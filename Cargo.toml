[workspace]
resolver = "2"
members = ["crates/core", "crates/diagnostics", "crates/proxy", "crates/transparent", "crates/nfqueue", "crates/dns", "crates/cli", "crates/gui"]

# Arayüz yalnızca Linux'ta anlamlı ve derlemesi C++ araçları ister.
# Varsayılan dışında bırakıyoruz ki diğer platformlarda `cargo test`
# çalışsın; arayüz `cargo build -p trdpi-gui` ile ayrıca derlenir.
default-members = ["crates/core", "crates/diagnostics", "crates/proxy", "crates/transparent", "crates/nfqueue", "crates/dns", "crates/cli"]

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.82"
license = "MIT"

[workspace.dependencies]
trdpi-core = { path = "crates/core" }
trdpi-proxy = { path = "crates/proxy" }
trdpi-dns = { path = "crates/dns" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
