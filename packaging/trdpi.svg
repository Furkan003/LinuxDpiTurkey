<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!--
    TR-DPI — "Akış".

    Kalkan yok: bu araç bir şeyi savunmuyor, kapalı bir yolu açıyor.
    Gri gövde engel; yeşil çizgi onun içinden gerçek bir kanal açıp
    iki ucundan da dışarı taşıyor — geçti ve yoluna devam ediyor.

    Kanal maskeyle **oyuluyor**, boyanmıyor: saydam kaldığı için zemin ne
    olursa olsun gerçek bir açıklık gibi duruyor. Koyu zeminde koyu, açık
    zeminde açık.

    Boyutlar ölçülerek seçildi. Önce ince çizgi + iki küçük blok denendi;
    32 pikselin altında engel kayboluyor, geriye anlamsız bir yeşil eğri
    kalıyordu. Kütle gövdeye verilince işaret 16 piksele kadar okunuyor.

    Yeşil, arayüzün "koruma açık" yeşilinin ta kendisi (#50c878).
  -->
  <defs>
    <mask id="kanal">
      <rect width="64" height="64" fill="#fff"/>
      <path d="M3 49 L61 15" stroke="#000" stroke-width="21" stroke-linecap="round"/>
    </mask>
  </defs>

  <rect x="4" y="4" width="56" height="56" rx="15" fill="#4a5058" mask="url(#kanal)"/>
  <path d="M3 49 L61 15" stroke="#50c878" stroke-width="10" stroke-linecap="round"/>
</svg>
