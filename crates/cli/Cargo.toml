[package]
name = "trdpi-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "TR-DPI Adaptive — tek komut: ölç, düzelt, koru."

[[bin]]
name = "trdpi"
path = "src/main.rs"

[dependencies]
trdpi-core = { workspace = true }
trdpi-dns = { workspace = true }
trdpi-diagnostics = { path = "../diagnostics" }
trdpi-transparent = { path = "../transparent" }
trdpi-nfqueue = { path = "../nfqueue" }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
